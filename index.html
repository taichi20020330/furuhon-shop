<title>浮かぶ古本屋</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Klee+One:wght@600&display=swap">
<style>
/* Layout: 白い無限の床に本がカテゴリごとの島で浮かぶ。上に検索、下に選んだ本のトレイ。 */
:root {
  --paper: #ffffff;        /* 背景（白） */
  --ink: #23262b;          /* 文字 */
  --ink-soft: #6c6f75;     /* 補助文字 */
  --hair: #e7e6e2;         /* 罫線 */
  --pencil: #4a4d55;       /* 鉛筆の値段 */
  --accent: #2d4a6b;       /* 藍：選択・ボタン */
  --accent-soft: #e9eef4;
  --sold: #a3342c;         /* 売約済の朱印 */
  --f-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --f-pencil: "Klee One", "Shippori Mincho", serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- 書籍空間 ---------- */
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }

.cluster-label {
  position: absolute; transform: translate(-50%, -50%);
  font-family: var(--f-display); font-weight: 700; font-size: 44px; letter-spacing: .12em;
  color: #f1f0ec; white-space: nowrap; pointer-events: none; user-select: none;
}
.cluster-label small { display: block; text-align: center; font-family: var(--f-body); font-size: 12px; letter-spacing: .2em; color: #b9b8b3; font-weight: 500; }

.book { position: absolute; width: var(--w); transform: translate(-50%, -50%); transition: opacity .35s, filter .35s; }
.book.dim { opacity: .12; filter: grayscale(1); pointer-events: none; }
.book.open { z-index: 5; }
.float { position: relative; animation: drift var(--dur, 7s) ease-in-out var(--delay, 0s) infinite alternate; }
@keyframes drift {
  0%   { transform: translateY(-6px) rotate(var(--r0, -1.5deg)); }
  100% { transform: translateY(8px)  rotate(var(--r1, 1.5deg)); }
}
.shadow {
  position: absolute; left: 12%; right: 12%; bottom: -26px; height: 12px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(30,32,38,.16), rgba(30,32,38,0));
  animation: shade var(--dur, 7s) ease-in-out var(--delay, 0s) infinite alternate;
}
@keyframes shade { 0% { transform: scale(.82); opacity: .7; } 100% { transform: scale(1); opacity: 1; } }

.flip { perspective: 1200px; width: 100%; aspect-ratio: var(--ar); cursor: pointer; }
.flipper { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,.7,.2,1); }
.open .flipper { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; filter: drop-shadow(0 6px 10px rgba(30,32,38,.10)); }
.face img { width: 100%; height: 100%; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; }
.face.back { transform: rotateY(180deg); }

/* 写真がない本の表紙（見本用） */
.cover {
  width: 100%; height: 100%; border-radius: 2px; background: var(--c-bg, #f6f4ee);
  display: grid; grid-template-rows: auto 1fr auto; padding: 9% 9% 7%; box-sizing: border-box; overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
}
.cover .band { height: 6px; background: var(--c-band, #555); margin-bottom: 10%; }
.cover .vt { writing-mode: vertical-rl; font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1.25; color: var(--c-ink, #222); justify-self: end; overflow: hidden; }
.cover .vt small { font-family: var(--f-body); font-weight: 500; font-size: 10px; margin-top: 10px; color: var(--c-sub, #666); }
.cover .pub { font-size: 9px; letter-spacing: .1em; color: var(--c-sub, #666); }
.cover.backside { grid-template-rows: 1fr auto; align-items: end; }
.cover.backside .meta { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 9px; color: var(--c-sub, #666); line-height: 1.7; }

/* 鉛筆の値段 */
.price {
  position: absolute; left: 50%; bottom: -54px; transform: translateX(-50%) rotate(-2deg);
  font-family: var(--f-pencil); font-size: 17px; color: var(--pencil); white-space: nowrap; pointer-events: none;
  font-variant-numeric: tabular-nums;
}

.pick {
  position: absolute; top: -10px; right: -10px; width: 34px; height: 34px; border-radius: 50%;
  border: 1.5px solid var(--accent); background: var(--paper); color: var(--accent);
  display: grid; place-items: center; cursor: pointer; z-index: 2; padding: 0;
  transition: background .2s, color .2s, transform .2s;
}
.pick:hover { transform: scale(1.08); }
.pick svg { width: 16px; height: 16px; }
.book.picked .pick { background: var(--accent); color: var(--paper); }
.book.picked .face { filter: drop-shadow(0 0 0 2px var(--accent)) drop-shadow(0 8px 14px rgba(45,74,107,.22)); }
.stamp {
  position: absolute; top: 34%; left: 50%; transform: translate(-50%,-50%) rotate(-12deg);
  border: 2px solid var(--sold); color: var(--sold); font-family: var(--f-display); font-weight: 700;
  padding: 2px 10px; font-size: 16px; letter-spacing: .15em; background: rgba(255,255,255,.85); pointer-events: none;
}
.sample-tag { position: absolute; left: -6px; top: -8px; font-size: 10px; letter-spacing: .1em; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--hair); padding: 0 5px; border-radius: 3px; pointer-events: none; }

/* 裏返したときの情報 */
.info {
  position: absolute; left: 50%; top: calc(100% + 66px); transform: translateX(-50%);
  width: max(200px, 150%); background: var(--paper); border: 1px solid var(--hair); border-radius: 10px;
  padding: 12px 14px; box-shadow: 0 10px 30px rgba(30,32,38,.08);
  display: none; cursor: default;
}
.book.open .info { display: block; animation: rise .3s ease-out; }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
.info h3 { margin: 0; font-family: var(--f-display); font-size: 17px; line-height: 1.35; text-wrap: balance; }
.info p { margin: 4px 0 0; font-size: 13px; color: var(--ink-soft); }
.info .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
.info .yen { font-family: var(--f-pencil); font-size: 20px; color: var(--pencil); }
.info .note { font-size: 12px; margin-top: 6px; color: var(--ink-soft); }

.btn {
  border: 0; border-radius: 999px; padding: 8px 16px; background: var(--accent); color: var(--paper);
  font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap;
}
.btn.ghost { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.btn:disabled { opacity: .35; cursor: default; }

/* ---------- 上部：店名と検索 ---------- */
.top {
  position: fixed; left: 0; right: 0; top: 0; z-index: 20;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 10px;
  display: flex; flex-direction: column; gap: 10px; pointer-events: none;
  background: linear-gradient(var(--paper) 70%, rgba(255,255,255,0));
}
.top > * { pointer-events: auto; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .14em; margin: 0; }
.hint { font-size: 12px; color: var(--ink-soft); }
.searchrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.search {
  flex: 1 1 240px; min-width: 0; display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--hair); border-radius: 999px; padding: 7px 14px; background: var(--paper);
}
.search input { border: 0; outline: 0; flex: 1; min-width: 0; background: transparent; font-size: 15px; }
.search svg { width: 16px; height: 16px; color: var(--ink-soft); flex: none; }
.select { border: 1px solid var(--hair); border-radius: 999px; padding: 7px 12px; background: var(--paper); font-size: 14px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--hair); background: var(--paper); border-radius: 999px;
  padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--ink);
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.found { font-size: 12px; color: var(--ink-soft); min-height: 1.2em; }

/* ---------- 下部：選んだ本のトレイ ---------- */
.tray {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 20;
  width: min(640px, 100%); box-sizing: border-box;
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
}
.tray-inner {
  display: flex; align-items: center; gap: 12px; background: var(--paper);
  border: 1px solid var(--hair); border-radius: 16px; padding: 10px 10px 10px 14px;
  box-shadow: 0 12px 36px rgba(30,32,38,.10);
}
.thumbs { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.thumbs::-webkit-scrollbar { display: none; }
.thumbs img, .thumbs .mini { height: 42px; width: auto; aspect-ratio: .64; object-fit: contain; flex: none; border-radius: 2px; }
.thumbs .mini { background: var(--c-bg); border-top: 4px solid var(--c-band); box-sizing: border-box; }
.tray-sum { font-size: 13px; color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tray-sum b { color: var(--ink); font-size: 16px; }
.tray-empty { flex: 1; min-width: 0; font-size: 13px; line-height: 1.4; color: var(--ink-soft); }

.zoom { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); z-index: 19; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--hair); background: var(--paper); cursor: pointer; font-size: 18px; line-height: 1; }

/* ---------- 注文シート ---------- */
.veil { position: fixed; inset: 0; background: rgba(35,38,43,.28); z-index: 40; display: grid; place-items: end center; }
.sheet {
  width: min(560px, 100%); max-height: 88%; overflow-y: auto; box-sizing: border-box;
  background: var(--paper); border-radius: 20px 20px 0 0;
  padding: 22px 20px calc(env(safe-area-inset-bottom, 0px) + 22px);
  animation: up .3s cubic-bezier(.3,.7,.2,1);
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet h2 { margin: 0 0 4px; font-family: var(--f-display); font-size: 22px; letter-spacing: .06em; }
.sheet .lead { margin: 0 0 16px; font-size: 13px; color: var(--ink-soft); }
.lines { list-style: none; margin: 0 0 6px; padding: 0; border-top: 1px solid var(--hair); }
.lines li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--hair); }
.lines .t { min-width: 0; font-size: 14px; }
.lines .t small { display: block; color: var(--ink-soft); font-size: 12px; }
.lines .y { font-family: var(--f-pencil); font-size: 17px; color: var(--pencil); font-variant-numeric: tabular-nums; }
.lines .x { border: 0; background: none; color: var(--ink-soft); cursor: pointer; font-size: 18px; padding: 2px 6px; }
.total { display: flex; justify-content: space-between; padding: 8px 0 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 13px; font-weight: 500; }
.field label span { color: var(--sold); font-size: 11px; margin-left: 4px; }
.field input, .field textarea { border: 1px solid var(--hair); border-radius: 10px; padding: 10px 12px; background: var(--paper); font-size: 16px; }
.field textarea { min-height: 64px; resize: vertical; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
.err { color: var(--sold); font-size: 13px; margin: 0 0 8px; }
.how { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: 13px; margin: 0 0 16px; }
.how ol { margin: 4px 0 0; padding-left: 1.3em; }
.done { text-align: center; padding: 10px 0; }
.done .mark { width: 54px; height: 54px; margin: 0 auto 10px; border-radius: 50%; background: var(--accent); color: var(--paper); display: grid; place-items: center; }
pre.preview { text-align: left; white-space: pre-wrap; font-size: 12px; background: #f6f6f4; border-radius: 10px; padding: 12px; overflow-x: auto; }

@media (max-width: 560px) {
  .brand { font-size: 19px; }
  .hint { display: none; }
  .cluster-label { font-size: 34px; }
}
@media (prefers-reduced-motion: reduce) {
  .float, .shadow { animation: none; }
  .flipper { transition: none; }
}
</style>

<div id="stage" aria-label="本の空間。ドラッグで移動できます">
  <div id="world"></div>
</div>

<header class="top">
  <div class="head">
    <h1 class="brand" id="shopName">浮かぶ古本屋</h1>
    <span class="hint">ドラッグで移動・本をタップで裏返す・＋で選ぶ</span>
  </div>
  <div class="searchrow">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="書名・著者・出版社で探す" autocomplete="off">
    </label>

<script>
/* =========================================================
   設定：ここを書き換えて使います
   ========================================================= */
const CONFIG = {
  shopName: "浮かぶ古本屋",
  // Google Apps Script のウェブアプリURL（README参照）。空のままだと送信せず、メール文面のプレビューを表示します。
  orderEndpoint: "",
};

/* 本のデータは data/books.csv から読み込みます（README参照）。
   price が空の行は「準備中」としてサイトに出ません。 */
const BOOKS_CSV = "data/books.csv";
let BOOKS = [];

/* =========================================================
   ここから下はふつう触らなくて大丈夫です
   ========================================================= */
/* ---------- CSV の読み込み ---------- */
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim());
  return rows.filter(r => r.some(v => v.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? "").trim()])));
}
const truthy = v => /^(1|true|yes|済|売約済|sold|○|x)$/i.test(String(v || "").trim());
async function loadBooks() {
  const res = await fetch(BOOKS_CSV, { cache: "no-cache" });
  if (!res.ok) throw new Error(res.status);
  return parseCSV(await res.text()).map((r, i) => ({
    id: r.id || r.isbn || "row" + (i + 2),
    title: r.title || "（書名未入力）", author: r.author || "", publisher: r.publisher || "", label: r.label || "",
    category: r.category || "未分類", format: r.format || "bunko",
    price: Number(String(r.price || "").replace(/[^0-9]/g, "")),
    condition: r.condition || "", sold: truthy(r.sold), sample: truthy(r.sample),
    front: r.front || "", back: r.back || "",
  })).filter(b => b.price > 0);
}

function start() {
document.getElementById("shopName").textContent = CONFIG.shopName;
document.title = CONFIG.shopName;

const FORMAT = { shinsho: { w: 128, ar: 0.6 }, bunko: { w: 120, ar: 0.66 }, tanko: { w: 150, ar: 0.7 } };
const PALETTE = [ // 簡易表紙の色（出版社ごとに固定）
  ["#f6f3ea","#8a3a2e","#2a2522","#7b736a"], ["#eef1f3","#2f4d63","#1f2a33","#64727c"],
  ["#f3efe4","#5b6b3a","#2a2a1f","#76735f"], ["#f4eeee","#6b2f45","#2c2023","#7d6c71"],
  ["#eceae4","#3d3d3d","#202020","#6d6d6d"], ["#f1ede2","#a1752b","#2b261c","#7c7363"],
];
const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const rng = seed => () => ((seed = Math.imul(seed ^ (seed >>> 15), 2246822507) ^ Math.imul(seed ^ (seed >>> 13), 3266489909)) >>> 0) / 4294967296;
const yen = n => "¥" + n.toLocaleString("ja-JP");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ---------- 配置：カテゴリごとに島をつくる ---------- */
const categories = [...new Set(BOOKS.map(b => b.category))];
const CELL_W = 760, CELL_H = 820;
const cols = Math.max(1, Math.ceil(Math.sqrt(categories.length * 1.4)));
const clusters = categories.map((name, i) => {
  const c = i % cols, r = Math.floor(i / cols);
  return { name, x: c * CELL_W + (r % 2 ? CELL_W / 2 : 0), y: r * CELL_H, books: BOOKS.filter(b => b.category === name) };
});
const world = document.getElementById("world");
const bookEls = new Map();

clusters.forEach(cl => {
  const lab = document.createElement("div");
  lab.className = "cluster-label";
  lab.style.left = cl.x + "px"; lab.style.top = cl.y + "px";
  lab.innerHTML = `${esc(cl.name)}<small>${cl.books.length}冊</small>`;
  world.appendChild(lab);

  const rand = rng(hash(cl.name));
  const n = cl.books.length;
  cl.books.forEach((b, i) => {
    // 中心のラベルを避けて、ゆるい円環に並べる
    const ang = (i / n) * Math.PI * 2 + rand() * 0.5 - 0.25 + (n === 1 ? Math.PI / 2 : 0);
    const rad = 210 + rand() * 70 + (n > 6 ? (i % 2) * 90 : 0);
    b._x = cl.x + Math.cos(ang) * rad * 1.15;
    b._y = cl.y + Math.sin(ang) * rad * 0.95;
    world.appendChild(makeBook(b, rand));
  });
});

function coverHTML(b, side) {
  const [bg, band, ink, sub] = PALETTE[hash(b.publisher) % PALETTE.length];
  const style = `--c-bg:${bg};--c-band:${band};--c-ink:${ink};--c-sub:${sub}`;
  if (side === "front") {
    return `<div class="cover" style="${style}"><div class="band"></div><div class="vt">${esc(b.title)}<small>${esc(b.author)}</small></div><div class="pub">${esc(b.label || b.publisher)}</div></div>`;
  }
  return `<div class="cover backside" style="${style}"><div></div><div class="meta">${esc(b.publisher)}<br>${esc(b.label || "")}<br>古書価 ${yen(b.price)}</div></div>`;
}

function makeBook(b, rand) {
  const f = FORMAT[b.format] || FORMAT.bunko;
  const el = document.createElement("div");
  el.className = "book" + (b.sold ? " sold" : "");
  el.dataset.id = b.id;
  el.style.cssText = `left:${b._x}px;top:${b._y}px;--w:${f.w}px;--ar:${f.ar};--dur:${(6 + rand() * 4).toFixed(2)}s;--delay:${(-rand() * 8).toFixed(2)}s;--r0:${(-2 + rand() * 1.5).toFixed(2)}deg;--r1:${(0.5 + rand() * 1.8).toFixed(2)}deg`;
  const front = b.front ? `<img src="${esc(b.front)}" alt="${esc(b.title)}の表紙" draggable="false">` : coverHTML(b, "front");
  const back = b.back ? `<img src="${esc(b.back)}" alt="${esc(b.title)}の裏表紙" draggable="false">` : coverHTML(b, "back");
  el.innerHTML = `
    <div class="float">
      <div class="flip" role="button" tabindex="0" aria-label="${esc(b.title)}を裏返す">
        <div class="flipper"><div class="face front">${front}</div><div class="face back">${back}</div></div>
      </div>
      ${b.sold ? `<div class="stamp">売約済</div>` : `<button class="pick" aria-label="${esc(b.title)}を選ぶ" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>`}
      ${b.sample ? `<span class="sample-tag">見本</span>` : ""}
    </div>
    <div class="shadow"></div>
    <div class="price">${b.sold ? "" : yen(b.price)}</div>
    <div class="info">
      <h3>${esc(b.title)}</h3>
      <p>${esc(b.author)} ／ ${esc(b.publisher)}${b.label ? "・" + esc(b.label) : ""}</p>
      ${b.condition ? `<div class="note">状態：${esc(b.condition)}</div>` : ""}
      <div class="row"><span class="yen">${b.sold ? "売約済" : yen(b.price)}</span>${b.sold ? "" : `<button class="btn ghost info-pick">選ぶ</button>`}</div>
    </div>`;
  const img = el.querySelector(".front img");
  if (img) {
    const fit = () => img.naturalWidth && el.style.setProperty("--ar", (img.naturalWidth / img.naturalHeight).toFixed(4));
    img.complete ? fit() : img.addEventListener("load", fit);
  }
  bookEls.set(b.id, el);
  return el;
}

/* ---------- 空間の移動（ドラッグ・ホイール・ピンチ） ---------- */
const stage = document.getElementById("stage");
const view = { x: 0, y: 0, s: 1 };
const apply = () => { world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`; };
const clampS = s => Math.min(1.8, Math.max(0.35, s));
function centerOn(wx, wy, s = view.s, animate = true) {
  const target = { s, x: innerWidth / 2 - wx * s, y: innerHeight / 2 + 40 - wy * s };
  if (!animate || matchMedia("(prefers-reduced-motion: reduce)").matches) { Object.assign(view, target); apply(); return; }
  const from = { ...view }, t0 = performance.now(), D = 650;
  const step = now => {
    const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3);
    view.x = from.x + (target.x - from.x) * e; view.y = from.y + (target.y - from.y) * e; view.s = from.s + (target.s - from.s) * e;
    apply(); if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function zoomAt(cx, cy, factor) {
  const ns = clampS(view.s * factor), k = ns / view.s;
  view.x = cx - (cx - view.x) * k; view.y = cy - (cy - view.y) * k; view.s = ns; apply();
}

const pointers = new Map();
let drag = null, pinch = null, moved = false;
stage.addEventListener("pointerdown", e => {
  if (e.target.closest("button, .info")) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  stage.setPointerCapture(e.pointerId);
  if (pointers.size === 1) { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; moved = false; }
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: view.s }; drag = null; moved = true;
  }
});
stage.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    zoomAt(mx, my, clampS(pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d) / view.s);
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) { moved = true; stage.classList.add("dragging"); }
    if (moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; apply(); }
  }
});
const endPointer = e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) {
    stage.classList.remove("dragging");
    if (drag && !moved) handleTap(e);
    drag = null;
  }
};
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", e => { moved = true; endPointer(e); });
stage.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
  else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
}, { passive: false });
document.getElementById("zin").onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1.2);
document.getElementById("zout").onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.2);

/* ---------- 裏返す・選ぶ ---------- */
function handleTap(e) {
  const hit = document.elementFromPoint(e.clientX, e.clientY);
  const flip = hit && hit.closest(".flip");
  if (flip) toggleOpen(flip.closest(".book"));
  else closeAll();
}
function closeAll(except) { document.querySelectorAll(".book.open").forEach(el => { if (el !== except) el.classList.remove("open"); }); }
function toggleOpen(el) { closeAll(el); el.classList.toggle("open"); }
world.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("flip")) { e.preventDefault(); toggleOpen(e.target.closest(".book")); }
});

const picked = new Set();
world.addEventListener("click", e => {
  const btn = e.target.closest(".pick, .info-pick");
  if (!btn) return;
  e.stopPropagation();
  togglePick(btn.closest(".book").dataset.id);
});
function togglePick(id) {
  const b = BOOKS.find(x => x.id === id);
  if (!b || b.sold) return;
  picked.has(id) ? picked.delete(id) : picked.add(id);
  renderPicks();
}
function renderPicks() {
  bookEls.forEach((el, id) => {
    const on = picked.has(id);
    el.classList.toggle("picked", on);
    const p = el.querySelector(".pick"); if (p) p.setAttribute("aria-pressed", on);
    const ip = el.querySelector(".info-pick"); if (ip) ip.textContent = on ? "選択をやめる" : "選ぶ";
  });
  const list = BOOKS.filter(b => picked.has(b.id));
  const total = list.reduce((s, b) => s + b.price, 0);
  document.getElementById("thumbs").innerHTML = list.map(b => {
    if (b.front) return `<img src="${esc(b.front)}" alt="${esc(b.title)}">`;
    const [bg, band] = PALETTE[hash(b.publisher) % PALETTE.length];
    return `<span class="mini" style="--c-bg:${bg};--c-band:${band}" title="${esc(b.title)}"></span>`;
  }).join("");
  document.getElementById("trayEmpty").hidden = list.length > 0;
  document.getElementById("traySum").hidden = list.length === 0;
  document.getElementById("trayCount").textContent = list.length;
  document.getElementById("trayTotal").textContent = yen(total);
  document.getElementById("openOrder").disabled = list.length === 0;
}

/* ---------- 検索・絞り込み ---------- */
const chipsEl = document.getElementById("chips");
chipsEl.innerHTML = `<button class="chip" data-cat="" aria-pressed="true">すべて</button>` +
  clusters.map(c => `<button class="chip" data-cat="${esc(c.name)}" aria-pressed="false">${esc(c.name)}</button>`).join("");
let activeCat = "";
chipsEl.addEventListener("click", e => {
  const chip = e.target.closest(".chip"); if (!chip) return;
  activeCat = chip.dataset.cat;
  chipsEl.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === chip));
  filter(true);
});
const qEl = document.getElementById("q"), maxEl = document.getElementById("maxPrice");
let qTimer; qEl.addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(() => filter(true), 250); });
maxEl.addEventListener("change", () => filter(true));

const norm = s => String(s || "").normalize("NFKC").toLowerCase().replace(/\s+/g, "");
function filter(move) {
  const q = norm(qEl.value), max = Number(maxEl.value) || Infinity;
  const hits = BOOKS.filter(b =>
    (!activeCat || b.category === activeCat) && b.price <= max &&
    (!q || norm(b.title + b.author + b.publisher + (b.label || "")).includes(q)));
  const ids = new Set(hits.map(b => b.id));
  const filtering = q || activeCat || max !== Infinity;
  bookEls.forEach((el, id) => el.classList.toggle("dim", filtering && !ids.has(id)));
  document.getElementById("found").textContent = filtering ? (hits.length ? `${hits.length}冊見つかりました` : "見つかりませんでした。言葉を変えてみてください") : "";
  if (move && hits.length) {
    const xs = hits.map(b => b._x), ys = hits.map(b => b._y);
    const w = Math.max(...xs) - Math.min(...xs) + 320, h = Math.max(...ys) - Math.min(...ys) + 420;
    const s = clampS(Math.min(1.1, innerWidth / w, (innerHeight - 200) / h));
    centerOn((Math.max(...xs) + Math.min(...xs)) / 2, (Math.max(...ys) + Math.min(...ys)) / 2, s);
  }
}

/* ---------- 注文 ---------- */
const veil = document.getElementById("veil"), sheet = document.getElementById("sheet");
document.getElementById("openOrder").onclick = () => showOrderForm();
veil.addEventListener("click", e => { if (e.target === veil) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !veil.hidden) closeSheet(); });
function closeSheet() { veil.hidden = true; }

const form = { name: "", contact: "", when: "", note: "" };
function showOrderForm(error) {
  const list = BOOKS.filter(b => picked.has(b.id));
  if (!list.length) { closeSheet(); return; }
  const total = list.reduce((s, b) => s + b.price, 0);
  sheet.innerHTML = `
    <h2 id="sheetTitle">取り置きの申し込み</h2>
    <p class="lead">支払いはまだ発生しません。本は受け取りのときに現金でお支払いください。</p>
    <ul class="lines">${list.map(b => `<li><div class="t">${esc(b.title)}<small>${esc(b.author)}／${esc(b.publisher)}</small></div><span class="y">${yen(b.price)}</span><button class="x" data-rm="${esc(b.id)}" aria-label="${esc(b.title)}を外す">×</button></li>`).join("")}</ul>
    <div class="total"><span>${list.length}冊</span><span>合計 ${yen(total)}</span></div>
    <div class="how">受け取りまでの流れ<ol><li>申し込みが店主に届きます</li><li>店主が本を箱に詰め、連絡先にご連絡します</li><li>約束の日に店主宅で、本と現金を交換します</li></ol></div>
    <form id="orderForm" novalidate>
      ${error ? `<p class="err">${esc(error)}</p>` : ""}
      <div class="field"><label for="f-name">お名前<span>必須</span></label><input id="f-name" name="name" autocomplete="name" value="${esc(form.name)}" required></div>
      <div class="field"><label for="f-contact">連絡先（メールまたは電話番号）<span>必須</span></label><input id="f-contact" name="contact" autocomplete="email" value="${esc(form.contact)}" required></div>
      <div class="field"><label for="f-when">受け取り希望の日時</label><input id="f-when" name="when" placeholder="例：10月12日（日）の午後" value="${esc(form.when)}"></div>
      <div class="field"><label for="f-note">ひとこと</label><textarea id="f-note" name="note">${esc(form.note)}</textarea></div>
      <div class="hp" aria-hidden="true"><label for="f-web">空欄のまま</label><input id="f-web" name="website" tabindex="-1" autocomplete="off"></div>
      <div class="actions"><button type="button" class="btn ghost" id="cancel">戻る</button><button type="submit" class="btn" id="send">この内容で申し込む</button></div>
    </form>`;
  veil.hidden = false;
  sheet.querySelectorAll("[data-rm]").forEach(x => x.onclick = () => { saveForm(); togglePick(x.dataset.rm); showOrderForm(); });
  sheet.querySelector("#cancel").onclick = () => { saveForm(); closeSheet(); };
  sheet.querySelector("#orderForm").addEventListener("submit", submitOrder);
}
function saveForm() {
  const f = sheet.querySelector("#orderForm"); if (!f) return;
  form.name = f.name.value.trim(); form.contact = f.contact.value.trim(); form.when = f.when.value.trim(); form.note = f.note.value.trim();
}

function buildOrder() {
  const list = BOOKS.filter(b => picked.has(b.id));
  return {
    shop: CONFIG.shopName,
    name: form.name, contact: form.contact, when: form.when, note: form.note,
    books: list.map(b => ({ id: b.id, title: b.title, author: b.author, publisher: b.publisher, label: b.label || "", price: b.price })),
    total: list.reduce((s, b) => s + b.price, 0),
    sentAt: new Date().toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" }),
  };
}
function mailText(o) {
  return `【${o.shop}】取り置きの申し込み\n\nお名前：${o.name}\n連絡先：${o.contact}\n受け取り希望：${o.when || "指定なし"}\nひとこと：${o.note || "なし"}\n\n` +
    o.books.map((b, i) => `${i + 1}. ${b.title}（${b.author}／${b.publisher}${b.label ? "・" + b.label : ""}）${yen(b.price)}  [${b.id}]`).join("\n") +
    `\n\n合計 ${o.books.length}冊 ${yen(o.total)}\n申込日時：${o.sentAt}`;
}

let sending = false;
async function submitOrder(e) {
  e.preventDefault();
  if (sending) return;
  saveForm();
  if (sheet.querySelector("#f-web").value) return; // ボット対策
  if (!form.name) return showOrderForm("お名前を入れてください。");
  if (!form.contact) return showOrderForm("連絡先を入れてください。受け取りの日程を連絡するのに使います。");
  const order = buildOrder();
  if (!CONFIG.orderEndpoint) return showDone(order, true);
  sending = true;
  const btn = sheet.querySelector("#send"); btn.disabled = true; btn.textContent = "送信中…";
  try {
    // Apps Script はCORSの応答を返さないため no-cors で送ります
    await fetch(CONFIG.orderEndpoint, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(order) });
    showDone(order, false);
  } catch (err) {
    showOrderForm("送信できませんでした。通信状況を確かめて、もう一度押してください。");
  } finally { sending = false; }
}
function showDone(order, demo) {
  sheet.innerHTML = `
    <div class="done">
      <div class="mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></div>
      <h2 id="sheetTitle">${demo ? "送信プレビュー" : "申し込みを受け付けました"}</h2>
      <p class="lead">${demo ? "送信先が未設定のため、店主に届くメールの文面を表示しています。" : `${esc(order.name)}さん、ありがとうございます。本の準備ができたら、${esc(order.contact)} にご連絡します。`}</p>
    </div>
    ${demo ? `<pre class="preview">${esc(mailText(order))}</pre>` : ""}
    <div class="actions"><button class="btn" id="fin">閉じる</button></div>`;
  sheet.querySelector("#fin").onclick = () => {
    if (!demo) { picked.clear(); renderPicks(); Object.assign(form, { name: "", contact: "", when: "", note: "" }); }
    closeSheet();
  };
}

/* ---------- 最初の表示 ---------- */
renderPicks();
const first = BOOKS[0] || { _x: 0, _y: 0 };
centerOn(first._x + 120, first._y - 60, innerWidth < 600 ? 0.62 : 0.9, false);
addEventListener("resize", () => filter(false));
}

loadBooks().then(list => { BOOKS = list; start(); }).catch(err => {
  document.getElementById("found").textContent = "本のデータ（data/books.csv）を読み込めませんでした。ファイルを直接開いた場合は README の「手元で確認する」を見てください。";
  console.error(err);
});
</script>
